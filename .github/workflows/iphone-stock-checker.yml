name: Check iPhone pickup stock
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Choose a stock check or send a test email'
        required: true
        type: choice
        default: check_stock
        options:
          - check_stock
          - test_email
permissions:
  contents: write
concurrency:
  group: iphone-stock-monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install monitor dependencies
        run: python -m pip install 'requests>=2.32,<3' 'python-dotenv>=1.0,<2'
      - name: Check and notify
        if: ${{ github.event_name == 'schedule' || inputs.run_mode != 'test_email' }}
        env:
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
        run: python cloud_monitor.py
      - name: Send test email
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'test_email' }}
        env:
          WATCHLIST_JSON: ${{ secrets.WATCHLIST_JSON }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.SMTP_USER }}
        run: python test_cloud_email.py
      - name: Persist deduplication state
        if: ${{ github.event_name == 'schedule' || inputs.run_mode != 'test_email' }}
        run: |
          if ! git diff --quiet -- cloud_state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cloud_state.json
            git commit -m 'Update iPhone alert delivery state [skip ci]'
            git push
          else
            echo 'No alert state changes'
          fi
