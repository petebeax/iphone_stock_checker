name: Schedule diagnostic

on:
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Print trigger details
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "UTC time: $(date -u)"
          echo "Branch: ${{ github.ref }}"
